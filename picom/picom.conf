
backend = "glx";
vsync = true;

# rounded corners on normal windows (matches theme); popups/menus get a
# slightly smaller radius and no shadow so GTK4 popovers (e.g. ghostty's
# right-click menu) don't show an oversized shadow box around the rounded
# shape.
corner-radius = 5;

shadow = true;
shadow-radius = 12;
shadow-opacity = 0.5;
shadow-offset-x = -12;
shadow-offset-y = -12;

fading = false;
fade-in-step = 0.08;
fade-out-step = 0.08;

rules = (
  {
    match = "window_type = 'menu' || window_type = 'popup_menu' || window_type = 'dropdown_menu' || window_type = 'tooltip' || override_redirect";
    shadow = false;
    corner-radius = 8;
  },
  {
    match = "fullscreen";
    corner-radius = 0;
    shadow = false;
  },
);
