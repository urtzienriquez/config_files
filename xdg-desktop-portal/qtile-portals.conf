# Portals for the qtile Wayland session (XDG_CURRENT_DESKTOP=qtile).
# Screen sharing (Zoom, browsers) and screenshots need xdg-desktop-portal-wlr;
# everything else (file chooser, settings/dark mode...) goes to the GTK portal.
[preferred]
default=gtk
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Screenshot=wlr
